name: README build

on:
  push:
    branches:
      - main
  schedule:
    # todo dia as 04:00 UTC (01:00 em Sao Paulo) para atualizar o Uptime
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: cache/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r cache/requirements.txt

      - name: Rebuild SVG cards
        run: python today.py

      - name: Commit
        run: |-
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "GitHub Actions Bot"
          git add -A
          git diff --staged --quiet || git commit -m "Updated README cards"
          git push
